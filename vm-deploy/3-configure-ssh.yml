---
- name: Optimize Node SSH Configurations for Ceph Cluster Scaling (Idempotent Shell)
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    target_cluster_nodes:
      - 192.168.122.216
      - 192.168.122.169
      - 192.168.122.101

  tasks:
    - name: Ensure PermitRootLogin is set to yes on all nodes natively
      ansible.builtin.shell:
        cmd: |
          ssh -o StrictHostKeyChecking=no student@{{ item }} "
            grep -q '^PermitRootLogin yes' /etc/ssh/sshd_config || (
              sudo sed -i 's/^#PermitRootLogin.*/PermitRootLogin yes/' /etc/ssh/sshd_config;
              sudo sed -i 's/^PermitRootLogin.*/PermitRootLogin yes/' /etc/ssh/sshd_config;
              sudo systemctl restart sshd;
              echo 'CHANGED'
            )
          "
      loop: "{{ target_cluster_nodes }}"
